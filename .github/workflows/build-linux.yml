name: Build Linux Installer

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão personalizada'
        required: false
        default: ''

jobs:
  build-linux:
    name: Build Linux Installer
    runs-on: ubuntu-latest

    steps:
    # 1. Baixar o código
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # 2. Configurar Java
    - name: Setup Java JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'gradle'

    # 3. Mudar para a pasta app
    - name: Navigate to app directory
      run: |
        echo "Entrando na pasta app..."
        cd app
        echo "Diretório atual: $(pwd)"
        echo "Arquivos encontrados:"
        ls -la

    # 4. Verificar se gradlew existe na pasta correta
    - name: Verify Gradle Wrapper in app
      run: |
        cd app
        if [ -f "gradlew" ]; then
          echo "✅ gradlew encontrado em app/"
          chmod +x gradlew
        else
          echo "❌ gradlew NÃO encontrado em app/"
          echo "Procurando em todo o repositório..."
          find . -name "gradlew" 2>/dev/null
          exit 1
        fi

    # 5. Executar testes
    - name: Run Tests
      working-directory: ./app
      run: |
        VERSION_ARG=""
        if [ -n "${{ github.event.inputs.version }}" ]; then
          VERSION_ARG="-Pgranawiz.version=${{ github.event.inputs.version }}"
        fi

        echo "Executando testes..."
        ./gradlew clean test $VERSION_ARG
        echo "✅ Testes concluídos!"

    # 6. Publicar resultados dos testes
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: granawiz-linux-test-results-v${{ github.sha }}
        path: app/build/test-results/test/*.xml
        retention-days: 7
        if-no-files-found: ignore

    # 7. Build do instalador
    - name: Build Installer
      working-directory: ./app
      run: |
        VERSION_ARG=""
        if [ -n "${{ github.event.inputs.version }}" ]; then
          VERSION_ARG="-Pgranawiz.version=${{ github.event.inputs.version }}"
          echo "Usando versão personalizada: ${{ github.event.inputs.version }}"
        fi

        echo "Gerando instaladores Linux..."
        ./gradlew packageDeb $VERSION_ARG

        echo "=== VERIFICANDO ARQUIVOS GERADOS ==="
        echo "Procurando em build/compose/binaries/:"

        INSTALLER_PATH="build/compose/binaries"

        DEB_FILES=$(find "$INSTALLER_PATH" -name "*.deb" 2>/dev/null)

        echo "Arquivos encontrados:"

        if [ -n "$DEB_FILES" ]; then
          echo "$DEB_FILES" | while read f; do
            SIZE=$(du -m "$f" | cut -f1)
            echo "✅ DEB: $f - ${SIZE} MB"
          done
        else
          echo "⚠️ Nenhum arquivo .deb encontrado em $INSTALLER_PATH"
        fi

        # Se NÃO encontrou DEB, falha o workflow
        if [ -z "$DEB_FILES" ]; then
          echo "❌ Nenhum instalador DEB encontrado!"

          # Debug: mostra estrutura completa
          echo "=== ESTRUTURA DE PASTAS (para debugging) ==="
          find . -maxdepth 4 -type f | head -50

          exit 1
        fi

        echo "✅ Build concluído com sucesso!"

    # 8. Upload dos instaladores
    - name: Upload Linux Installers
      uses: actions/upload-artifact@v4
      with:
        name: granawiz-linux-installers-v${{ github.sha }}
        path: |
          app/build/compose/binaries/main/deb/*.deb
        retention-days: 7
        if-no-files-found: error
