name: Build Installers

on:
  pull_request:
    branches:
      - 'main'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão personalizada'
        required: false
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Java JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Run Tests
      working-directory: ./app
      run: |
        VERSION_ARG=""
        if [ -n "${{ github.event.inputs.version }}" ]; then
          VERSION_ARG="-Pgranawiz.version=${{ github.event.inputs.version }}"
        fi
        ./gradlew clean test $VERSION_ARG

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: granawiz-test-results-v${{ github.sha }}
        path: app/build/test-results/test/*.xml
        retention-days: 7
        if-no-files-found: ignore

  build-linux:
    name: Build Linux Installer
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Java JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build Installer
      working-directory: ./app
      run: |
        VERSION_ARG=""
        if [ -n "${{ github.event.inputs.version }}" ]; then
          VERSION_ARG="-Pgranawiz.version=${{ github.event.inputs.version }}"
        fi
        ./gradlew packageDeb $VERSION_ARG

    - name: Upload Linux Installer
      uses: actions/upload-artifact@v4
      with:
        name: granawiz-linux-installers-v${{ github.sha }}
        path: app/build/compose/binaries/main/deb/*.deb
        retention-days: 7
        if-no-files-found: error

  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    needs: test

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Java JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build Installer
      working-directory: ./app
      run: |
        $VERSION_ARG = ""
        if ("${{ github.event.inputs.version }}") {
          $VERSION_ARG = "-Pgranawiz.version=${{ github.event.inputs.version }}"
        }
        .\gradlew.bat packageMsi $VERSION_ARG

    - name: Upload Windows Installer
      uses: actions/upload-artifact@v4
      with:
        name: granawiz-windows-installers-v${{ github.sha }}
        path: app/build/compose/binaries/main/msi/*.msi
        retention-days: 7
        if-no-files-found: error
