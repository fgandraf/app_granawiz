name: Build Windows Installer

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão personalizada'
        required: false
        default: ''

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
    # 1. Baixar o código
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # 2. Configurar Java
    - name: Setup Java JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'gradle'

    # 3. Mudar para a pasta app
    - name: Navigate to app directory
      run: |
        Write-Host "Entrando na pasta app..."
        cd app
        Write-Host "Diretório atual: $(Get-Location)"
        Write-Host "Arquivos encontrados:"
        Get-ChildItem

    # 4. Verificar se gradlew.bat existe na pasta correta
    - name: Verify Gradle Wrapper in app
      run: |
        cd app
        if (Test-Path "gradlew.bat") {
          Write-Host "✅ gradlew.bat encontrado em app/"
        } else {
          Write-Error "❌ gradlew.bat NÃO encontrado em app/"
          Write-Host "Procurando em todo o repositório..."
          Get-ChildItem -Recurse -Filter "gradlew.bat" -ErrorAction SilentlyContinue
          exit 1
        }

    # 5. Executar testes
    - name: Run Tests
      working-directory: ./app
      run: |
        $VERSION_ARG = ""
        if ("${{ github.event.inputs.version }}") {
          $VERSION_ARG = "-Pgranawiz.version=${{ github.event.inputs.version }}"
        }

        Write-Host "Executando testes..."
        .\gradlew.bat clean test $VERSION_ARG
        Write-Host "✅ Testes concluídos!"

    # 6. Publicar resultados dos testes
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: granawiz-windows-test-results-v${{ github.sha }}
        path: app/build/test-results/test/*.xml
        retention-days: 7
        if-no-files-found: ignore

    # 7. Build do instalador
    - name: Build Installer
      working-directory: ./app
      run: |
        $VERSION_ARG = ""
        if ("${{ github.event.inputs.version }}") {
          $VERSION_ARG = "-Pgranawiz.version=${{ github.event.inputs.version }}"
          Write-Host "Usando versão personalizada: ${{ github.event.inputs.version }}"
        }

        Write-Host "Gerando instaladores Windows..."
        .\gradlew.bat packageMsi $VERSION_ARG

        Write-Host "=== VERIFICANDO ARQUIVOS GERADOS ==="
        Write-Host "Procurando em build/compose/binaries/:"

        $INSTALLER_PATH = "build\compose\binaries"
        
        $msiFiles = Get-ChildItem -Path "$INSTALLER_PATH" -Recurse -Filter "*.msi" -ErrorAction SilentlyContinue
        
        Write-Host "Arquivos encontrados:"
        
        if ($msiFiles) {
          $msiFiles | ForEach-Object { 
            Write-Host "✅ MSI: $($_.FullName) - $([math]::Round($_.Length/1MB,2)) MB" 
          }
        } else {
          Write-Warning "Nenhum arquivo .msi encontrado em $INSTALLER_PATH"
        }
        
        # Se NÃO encontrou MSI, falha o workflow
        if (-not $msiFiles) {
          Write-Error "❌ Nenhum instalador MSI encontrado!"
          
          # Debug: mostra estrutura completa
          Write-Host "=== ESTRUTURA DE PASTAS (para debugging) ==="
          Get-ChildItem -Path "." -Recurse -Depth 3 | Select-Object FullName | Format-Table
          
          exit 1
        }
        
        Write-Host "✅ Build concluído com sucesso!"

    # 8. Upload dos instaladores
    - name: Upload Windows Installers
      uses: actions/upload-artifact@v4
      with:
        name: granawiz-windows-installers-v${{ github.sha }}
        path: |
          app/build/compose/binaries/main/msi/*.msi
        retention-days: 7
        if-no-files-found: error
